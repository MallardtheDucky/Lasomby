<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Third Lasombian Republic | Government Terminal</title>
    
    <!-- SOCIAL / DISCORD EMBED TAGS -->
    <meta property="og:title" content="The Third Lasombian Republic Archives">
    <meta property="og:description" content="Official government terminal. View strategic maps, cabinet dossiers, economic reports, and budget allocations for the Third Republic.">
    <meta property="og:image" content="images/Lasomby Flag.png">
    <meta property="og:url" content="https://mallardtheducky.github.io/Lasomby/">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#c5a059">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Lato:wght@300;400;700;900&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Special+Elite&family=VT323&display=swap');
        
        :root {
            --suzerain-gold: #c5a059;
            --suzerain-dark: #1a1816;
            --suzerain-brown: #2c241b;
            --suzerain-red: #8b0000;
            --suzerain-paper: #f4f0e6;
        }

        body {
            background-color: #0f0e0d;
            color: #2c241b;
            overflow: hidden; /* Main scroll handled by React container */
            font-size: 16px;
        }
        
        /* Textures */
        .bg-wood {
            background-color: #1a1512;
            background-image: 
                linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.3)),
                url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            background-attachment: fixed;
            background-size: cover;
        }

        .paper-texture {
            background-color: #f4f0e6;
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.5), 0 0 5px rgba(0,0,0,0.1);
        }

        .stamp {
            mask-image: url('https://www.transparenttextures.com/patterns/grunge-wall.png');
            -webkit-mask-image: url('https://www.transparenttextures.com/patterns/grunge-wall.png');
        }

        /* Typography */
        .font-header { font-family: 'Playfair Display', serif; }
        .font-ui { font-family: 'Lato', sans-serif; }
        .font-body { font-family: 'Merriweather', serif; }
        .font-typewriter { font-family: 'Special Elite', monospace; }
        .font-terminal { font-family: 'VT323', monospace; }

        /* Animations */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px) rotate(0.5deg); }
            to { opacity: 1; transform: translateY(0) rotate(0deg); }
        }
        
        @keyframes stamp-in {
            0% { opacity: 0; transform: scale(2) rotate(-20deg); }
            50% { opacity: 1; transform: scale(0.9) rotate(-10deg); }
            70% { transform: scale(1.05) rotate(-13deg); }
            100% { transform: scale(1) rotate(-12deg); }
        }

        @keyframes scanline {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }
        
        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.95; }
            10% { opacity: 0.9; }
            15% { opacity: 0.95; }
            20% { opacity: 0.99; }
            50% { opacity: 0.95; }
            100% { opacity: 0.98; }
        }

        @keyframes crt-on {
            0% { transform: scale(1, 0.002); opacity: 0; filter: brightness(3); }
            20% { transform: scale(1, 0.002); opacity: 1; }
            50% { transform: scale(1, 0.002); opacity: 1; }
            60% { transform: scale(1, 1); opacity: 1; }
            100% { transform: scale(1, 1); opacity: 1; filter: brightness(1); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .animate-report { animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .animate-stamp { animation: stamp-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards opacity-0; }
        .animate-blink { animation: blink 1s step-end infinite; }
        .crt-turn-on { animation: crt-on 0.4s ease-out forwards; transform-origin: center; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1816; }
        ::-webkit-scrollbar-thumb { background: #4a4036; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #c5a059; }

        /* CRT Effects - FIXED POSITIONING FOR FULL COVERAGE */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9998;
            animation: flicker 4s infinite;
        }

        .scan-line {
            position: fixed;
            top: 0; left: 0; width: 100vw;
            height: 20vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.05), rgba(255,255,255,0));
            animation: scanline 8s linear infinite;
            pointer-events: none;
            z-index: 9999;
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.5) 100%);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 9997;
        }
        
        /* Modal Backdrop */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(2px);
            z-index: 9000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #c5a059;
            border: 2px solid #2c241b;
            cursor: pointer;
            margin-top: -8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #d1c7b7;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-wood min-h-screen text-gray-200">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- ICON POLYFILL ---
        const createLucideComponent = (iconName) => ({ size = 24, className = "", ...props }) => {
            const iconDef = lucide.icons[iconName] || lucide.icons[iconName.charAt(0).toLowerCase() + iconName.slice(1)];
            if (!iconDef) return null;
            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" 
                    fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" 
                    className={className} {...props}
                >
                    {iconDef.map(([tag, attrs], i) => React.createElement(tag, { ...attrs, key: i }))}
                </svg>
            );
        };

        const Icons = Object.fromEntries(
            ['Landmark', 'Users', 'BookOpen', 'Shield', 'TrendingUp', 'Menu', 'X', 
             'Gavel', 'AlertTriangle', 'Crosshair', 'Anchor', 'Wind', 'PieChart', 
             'Scroll', 'Map', 'Newspaper', 'ChevronRight', 'Clock', 'Trash2', 'Plus', 
             'Upload', 'BarChart', 'Target', 'Briefcase', 'Scale', 'FileText', 'CheckCircle', 'XCircle', 'Mail', 'Radio', 'Info'].map(name => [name, createLucideComponent(name)])
        );

        const FLAG_URL = "images/Lasomby Flag.png";

        // --- COMPONENTS ---
        
        const BootScreen = ({ onComplete }) => {
            const [lines, setLines] = useState([]);
            
            useEffect(() => {
                const bootText = [
                    "BIOS DATE 01/12/49 14:22:51 VER 1.02",
                    "CPU: MERKOPA-880, SPEED: 200MHz",
                    "640K RAM SYSTEM  256K EXTENDED",
                    "Checking NVRAM..",
                    "Loading LASOMBY_KERNEL.SYS.....",
                    "Initializing Graphics Adapter...",
                    "Mounting Volume C: [SYSTEM_ROOT]...",
                    "Connecting to Government Intranet...",
                    "Secure Link Established.",
                    "Welcome, President Varela."
                ];

                let delay = 0;
                bootText.forEach((line, index) => {
                    delay += Math.random() * 300 + 150;
                    setTimeout(() => {
                        setLines(prev => [...prev, line]);
                        if (index === bootText.length - 1) {
                            setTimeout(onComplete, 800);
                        }
                    }, delay);
                });
            }, []);

            return (
                <div className="fixed inset-0 bg-black z-[10000] p-8 font-terminal text-[#c5a059] text-xl leading-relaxed overflow-hidden crt-turn-on">
                    {lines.map((line, i) => (
                        <div key={i}>{line}</div>
                    ))}
                    <div className="animate-blink mt-2">_</div>
                </div>
            );
        };

        const DecryptText = ({ text }) => {
            const [display, setDisplay] = useState(text);
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
            
            useEffect(() => {
                let iterations = 0;
                const interval = setInterval(() => {
                    setDisplay(text.split("").map((letter, index) => {
                        if(index < iterations) return text[index];
                        return chars[Math.floor(Math.random() * chars.length)];
                    }).join(""));
                    
                    if(iterations >= text.length) clearInterval(interval);
                    iterations += 1/3;
                }, 30);
                return () => clearInterval(interval);
            }, [text]);

            return <span>{display}</span>;
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="modal-backdrop" onClick={onClose}>
                    <div className="bg-[#f4f0e6] p-6 max-w-lg w-full shadow-2xl border-4 border-[#2c241b] relative animate-report" onClick={e => e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-2 right-2 text-[#8b0000] hover:bg-[#8b0000]/10 p-1 rounded">
                            <Icons.X size={24} />
                        </button>
                        <h2 className="font-header text-3xl font-bold mb-4 border-b-2 border-[#c5a059] pb-2 text-[#2c241b]">{title}</h2>
                        <div className="font-body text-[#2c241b] text-sm md:text-base leading-relaxed max-h-[60vh] overflow-y-auto">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const Dossier = ({ name, role, traits, bio, image, onClose }) => (
            <Modal isOpen={true} onClose={onClose} title={`Dossier: ${name}`}>
                <div className="flex flex-col md:flex-row gap-6">
                    <div className="shrink-0">
                        <div className="w-32 h-40 bg-gray-300 border-4 border-[#2c241b] relative shadow-lg transform -rotate-2">
                            <img src={image} className="w-full h-full object-cover grayscale contrast-125 sepia" />
                            <div className="absolute -bottom-3 -right-3 w-12 h-12 bg-[#8b0000] rounded-full flex items-center justify-center text-white text-[10px] font-bold border-2 border-white transform rotate-12 shadow">
                                TOP SEC
                            </div>
                        </div>
                    </div>
                    <div>
                        <div className="mb-4">
                            <span className="font-bold text-xs uppercase tracking-widest text-[#5d5244] block">Current Assignment</span>
                            <span className="font-header text-lg font-bold">{role}</span>
                        </div>
                        <div className="mb-4">
                             <span className="font-bold text-xs uppercase tracking-widest text-[#5d5244] block mb-1">Key Traits</span>
                             <div className="flex flex-wrap gap-2">
                                {traits.map(t => (
                                    <span key={t} className="bg-[#2c241b] text-[#f4f0e6] px-2 py-0.5 text-xs font-bold uppercase">{t}</span>
                                ))}
                             </div>
                        </div>
                    </div>
                </div>
                <div className="mt-6 pt-4 border-t border-[#d1c7b7]">
                    <span className="font-bold text-xs uppercase tracking-widest text-[#5d5244] block mb-2">Background Summary</span>
                    <p className="font-typewriter text-sm text-justify">{bio}</p>
                </div>
            </Modal>
        );

        const SimpleBarChart = ({ data, height = 150 }) => {
            const maxVal = Math.max(...data.map(d => d.value));
            return (
                <div className="flex items-end justify-between gap-2 h-full w-full pt-4 px-2">
                    {data.map((d, i) => (
                        <div key={i} className="flex flex-col items-center flex-1 group">
                            <div className="relative w-full flex justify-center">
                                {/* Tooltip */}
                                <div className="absolute bottom-full mb-1 opacity-0 group-hover:opacity-100 transition-opacity bg-[#1a1816] text-[#e2d5c3] text-[10px] px-2 py-1 border border-[#c5a059] pointer-events-none z-10 whitespace-nowrap">
                                    {d.label}: {d.value}
                                </div>
                                <div 
                                    className="w-full max-w-[30px] min-w-[15px] bg-[#2c241b] border border-[#5d5244] group-hover:bg-[#c5a059] transition-colors shadow-sm" 
                                    style={{height: `${(d.value / maxVal) * height}px`}}
                                ></div>
                            </div>
                            <span className="text-[8px] md:text-[9px] font-bold uppercase mt-2 text-[#5d5244] text-center leading-tight">{d.shortLabel || d.label}</span>
                        </div>
                    ))}
                </div>
            );
        };

        const SimplePieChart = ({ data, size = 120 }) => {
            const total = data.reduce((acc, d) => acc + d.value, 0);
            let currentAngle = 0;

            return (
                <div className="relative flex flex-col md:flex-row items-center justify-center gap-4">
                    <svg width={size} height={size} viewBox="-1 -1 2 2" style={{transform: 'rotate(-90deg)'}}>
                        {data.map((d, i) => {
                            const sliceAngle = (d.value / total) * 2 * Math.PI;
                            const x1 = Math.cos(currentAngle);
                            const y1 = Math.sin(currentAngle);
                            const x2 = Math.cos(currentAngle + sliceAngle);
                            const y2 = Math.sin(currentAngle + sliceAngle);
                            const largeArc = sliceAngle > Math.PI ? 1 : 0;
                            
                            const pathData = `M 0 0 L ${x1} ${y1} A 1 1 0 ${largeArc} 1 ${x2} ${y2} Z`;
                            currentAngle += sliceAngle;
                            
                            return (
                                <path 
                                    key={i} 
                                    d={pathData} 
                                    fill={d.color} 
                                    stroke="#f4f0e6" 
                                    strokeWidth="0.02"
                                    className="hover:opacity-80 transition-opacity cursor-pointer"
                                >
                                    <title>{d.label}: {d.value}%</title>
                                </path>
                            );
                        })}
                    </svg>
                    <div className="flex flex-col justify-center whitespace-nowrap gap-2">
                         {data.map((d, i) => (
                             <div key={i} className="flex items-center gap-2">
                                 <div className="w-3 h-3 rounded-full border border-black/20" style={{backgroundColor: d.color}}></div>
                                 <span className="text-xs font-bold font-ui text-[#5d5244]">{d.label} <span className="text-[#2c241b] opacity-60">({d.value}%)</span></span>
                             </div>
                         ))}
                    </div>
                </div>
            );
        };

        const BudgetSlider = ({ label, value, onChange, icon: Icon }) => (
            <div className="mb-4">
                <div className="flex justify-between items-center mb-1">
                    <div className="flex items-center gap-2">
                        <Icon size={14} className="text-[#5d5244]" />
                        <span className="font-bold text-xs uppercase text-[#2c241b] tracking-wider">{label}</span>
                    </div>
                    <span className={`text-xs font-bold ${value > 5 ? 'text-[#4caf50]' : value < 5 ? 'text-[#e53935]' : 'text-[#ffb74d]'}`}>
                        {value > 5 ? 'INCREASED' : value < 5 ? 'DECREASED' : 'MAINTAINED'}
                    </span>
                </div>
                <input 
                    type="range" 
                    min="1" 
                    max="10" 
                    value={value} 
                    onChange={(e) => onChange(parseInt(e.target.value))}
                    className="w-full h-2 bg-[#d1c7b7] rounded-lg appearance-none cursor-pointer"
                />
            </div>
        );

        const DecisionCard = ({ title, desc, onApprove, onVeto }) => (
             <div className="bg-[#fcfbf9] border-2 border-[#d1c7b7] p-4 shadow-sm mb-4 transform hover:scale-[1.01] transition-transform">
                <div className="flex justify-between items-start mb-2">
                    <h4 className="font-header font-bold text-lg text-[#2c241b]">{title}</h4>
                    <Icons.FileText size={18} className="text-[#c5a059]" />
                </div>
                <p className="font-body text-sm text-[#5d5244] mb-4">{desc}</p>
                <div className="flex gap-2">
                    <button onClick={onApprove} className="flex-1 bg-[#2c241b] text-[#f4f0e6] py-2 px-4 text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 hover:bg-[#4a4036] transition-colors border-2 border-transparent">
                        <Icons.CheckCircle size={14} /> Approve
                    </button>
                    <button onClick={onVeto} className="flex-1 bg-transparent text-[#8b0000] border-2 border-[#8b0000] py-2 px-4 text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 hover:bg-[#8b0000] hover:text-white transition-colors">
                        <Icons.XCircle size={14} /> Veto
                    </button>
                </div>
            </div>
        );

        const Tooltip = ({ text, children }) => {
            const [show, setShow] = useState(false);
            return (
                <div className="relative flex items-center" onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)}>
                    {children}
                    {show && (
                        <div className="absolute left-1/2 -translate-x-1/2 top-full mt-2 z-50 w-48 bg-[#1a1816] border border-[#c5a059] p-2 shadow-xl text-xs text-[#e2d5c3] font-ui tracking-wide animate-fadeIn pointer-events-none text-center">
                            {text}
                        </div>
                    )}
                </div>
            );
        };

        const StatItem = ({ icon: Icon, label, value, trend, desc }) => (
            <Tooltip text={desc}>
                <div className="flex flex-col items-center justify-center px-4 md:px-6 border-r border-[#ffffff10] last:border-0 min-w-[80px] md:min-w-[100px] cursor-help transition-colors hover:bg-[#ffffff05] py-2">
                    <div className="flex items-center gap-2 mb-1">
                        <Icon size={16} className="text-[#c5a059] hidden md:block" />
                        <span className={`font-header font-bold text-lg md:text-xl ${trend === 'positive' ? 'text-[#4caf50]' : trend === 'negative' ? 'text-[#e53935]' : 'text-[#ffb74d]'}`}>
                            {value}
                        </span>
                    </div>
                    <span className="text-[8px] md:text-[9px] uppercase tracking-[0.2em] text-[#8a7f70] font-bold">{label}</span>
                </div>
            </Tooltip>
        );

        const Portrait = ({ id, name, role, align = "center", currentImage, onUpload, onDossier }) => {
            const fileInputRef = useRef(null);
            const handleUploadClick = (e) => {
                e.stopPropagation();
                fileInputRef.current.click();
            };
            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => onUpload(id, reader.result);
                    reader.readAsDataURL(file);
                }
            };

            return (
                <div className={`flex flex-col items-center md:items-${align} mb-6 group relative w-full md:w-auto`}>
                    <input type="file" ref={fileInputRef} onChange={handleFileChange} className="hidden" accept="image/*" />
                    
                    <div onClick={onDossier} className="w-40 h-48 bg-[#2c241b] border-[6px] border-[#3d342b] shadow-[0_5px_15px_rgba(0,0,0,0.5)] overflow-hidden relative transition-all duration-300 group-hover:border-[#c5a059] group-hover:-translate-y-1 cursor-pointer">
                        <div className="absolute inset-0 bg-cover bg-center grayscale contrast-125 sepia-[.4]" style={{backgroundImage: `url('${currentImage}')`}}></div>
                        <div className="w-full h-full bg-gradient-to-t from-[#1a1816] via-transparent to-transparent absolute z-10 opacity-60"></div>
                        <div className="absolute top-2 right-2 z-30 opacity-0 group-hover:opacity-100 transition-opacity bg-black/50 p-1 rounded hover:bg-[#c5a059] hover:text-black" onClick={handleUploadClick}>
                            <Icons.Upload size={16} className="text-white hover:text-black" />
                        </div>
                        <div className="absolute bottom-0 w-full bg-[#8b0000] text-white text-[9px] text-center font-bold py-1 opacity-0 group-hover:opacity-100 transition-opacity uppercase tracking-widest">
                            Click for Dossier
                        </div>
                    </div>
                    
                    <div className={`mt-3 text-center md:text-${align} relative z-20 bg-[#1a1816]/80 px-4 py-2 border-l-2 border-[#c5a059] backdrop-blur-sm pointer-events-none w-full md:w-auto`}>
                        <h3 className="font-header font-bold text-[#e2d5c3] text-xl leading-none mb-1">{name}</h3>
                        <p className="font-ui text-[10px] uppercase tracking-widest text-[#c5a059]">{role}</p>
                    </div>
                </div>
            );
        };

        const PaperReport = ({ title, subtitle, date, classification = "UNCLASSIFIED", children, emblem = true }) => (
            <div className="animate-report relative mx-auto max-w-4xl perspective-1000 mb-20">
                <div className="paper-texture text-[#2c241b] p-6 md:p-16 min-h-[600px] relative z-10 transform transition-transform duration-500 hover:rotate-0 border border-[#d1c7b7]">
                    
                    {emblem && <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 md:w-64 md:h-64 border-4 border-[#2c241b] rounded-full opacity-[0.03] pointer-events-none flex items-center justify-center">
                        <div className="w-32 h-32 md:w-48 md:h-48 border-2 border-[#2c241b] rounded-full"></div>
                    </div>}

                    <div className="animate-stamp opacity-0 absolute top-4 right-4 md:top-8 md:right-8 border-[3px] border-[#8b0000] p-1 px-3 md:p-2 md:px-4 rotate-[-12deg] z-20 mix-blend-multiply">
                        <span className="text-[#8b0000] font-black font-typewriter uppercase tracking-widest text-[10px] md:text-sm block stamp">{classification}</span>
                    </div>

                    <div className="border-b-4 double-border border-[#2c241b] pb-6 mb-8 text-center mt-6 md:mt-0">
                        <div className="flex justify-center items-center gap-2 mb-4 text-[#5d5244] opacity-80">
                            <Icons.Anchor size={16} />
                            <span className="font-ui text-[10px] md:text-xs uppercase tracking-[0.3em]">Official State Document</span>

        const ParliamentBuilder = ({ initialData }) => {
            const [parties, setParties] = useState(initialData);

            const handleUpdate = (index, field, value) => {
                const newParties = [...parties];
                newParties[index] = { ...newParties[index], [field]: value };
                setParties(newParties);
            };

            const addParty = () => setParties([...parties, { id: Date.now(), name: "New Party", seats: 10, color: "#5d5244" }]);
            const removeParty = (index) => setParties(parties.filter((_, i) => i !== index));
            const totalSeats = parties.reduce((acc, p) => acc + parseInt(p.seats || 0), 0);

            const generateSeats = () => {
                const rows = 8;
                const baseRadius = 120;
                const allPositions = [];
                for(let r = 0; r < rows; r++) {
                    const radius = baseRadius + (r * 22);
                    const seatSize = 14; 
                    const arcLength = Math.PI * radius;
                    const countInRow = Math.floor(arcLength / seatSize);
                    const angleStep = Math.PI / (countInRow - 1);
                    for(let s = 0; s < countInRow; s++) {
                         const angle = Math.PI - (s * angleStep);
                         const x = 300 + (radius * Math.cos(angle));
                         const y = 350 - (radius * Math.sin(angle));
                         allPositions.push({ x, y, r });
                    }
                }
                
                let currentPartyIndex = 0;
                let seatsInCurrentPartyProcessed = 0;
                const usedPositions = allPositions.slice(0, totalSeats);

                return usedPositions.map((pos, i) => {
                    const party = parties[currentPartyIndex];
                    if (!party) return null;
                    seatsInCurrentPartyProcessed++;
                    if (seatsInCurrentPartyProcessed > party.seats) {
                        currentPartyIndex++;
                        seatsInCurrentPartyProcessed = 1;
                    }
                    const actualParty = parties[currentPartyIndex] || parties[parties.length-1];
                    return (
                        <circle key={i} cx={pos.x} cy={pos.y} r="5" fill={actualParty.color} stroke="#2c241b" strokeWidth="1" className="transition-all duration-300 hover:r-8">
                            <title>{actualParty.name}</title>
                        </circle>
                    );
                });

                                <g>{generateSeats()}</g>
                            </svg>

                                <span className="bg-[#2c241b] text-[#c5a059] px-3 py-1 font-bold rounded text-sm shadow-md">Total Seats: {totalSeats}</span>
                            </div>
