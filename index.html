<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Third Lasombian Republic | Government Terminal</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts: Playfair (Headers), Lato (UI), Merriweather (Body), Special Elite (Typewriter) -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Lato:wght@300;400;700;900&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Special+Elite&display=swap');
        
        :root {
            --suzerain-gold: #c5a059;
            --suzerain-dark: #1a1816;
            --suzerain-brown: #2c241b;
            --suzerain-red: #8b0000;
            --suzerain-paper: #f4f0e6;
            --suzerain-paper-shadow: rgba(0,0,0,0.4);
        }

        body {
            background-color: #0f0e0d;
            color: #2c241b;
            overflow-x: hidden;
        }
        
        /* Textures */
        .bg-wood {
            background-color: #1a1512;
            background-image: 
                linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.2)),
                url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            background-attachment: fixed;
        }

        .paper-texture {
            background-color: #f4f0e6;
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.5), 0 0 5px rgba(0,0,0,0.1);
        }

        .stamp {
            mask-image: url('https://www.transparenttextures.com/patterns/grunge-wall.png');
            -webkit-mask-image: url('https://www.transparenttextures.com/patterns/grunge-wall.png');
        }

        /* Typography */
        .font-header { font-family: 'Playfair Display', serif; }
        .font-ui { font-family: 'Lato', sans-serif; }
        .font-body { font-family: 'Merriweather', serif; }
        .font-typewriter { font-family: 'Special Elite', monospace; }

        /* Animations */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px) rotate(0.5deg); }
            to { opacity: 1; transform: translateY(0) rotate(0deg); }
        }
        
        @keyframes stamp-in {
            0% { opacity: 0; transform: scale(2) rotate(-20deg); }
            50% { opacity: 1; transform: scale(0.9) rotate(-10deg); }
            70% { transform: scale(1.05) rotate(-13deg); }
            100% { transform: scale(1) rotate(-12deg); }
        }

        .animate-report { animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .animate-stamp { animation: stamp-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards opacity-0; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1816; }
        ::-webkit-scrollbar-thumb { background: #4a4036; border-radius: 4px; border: 1px solid #1a1816; }
        ::-webkit-scrollbar-thumb:hover { background: #c5a059; }

        /* Custom UI Elements */
        .nav-item-active {
            background: linear-gradient(90deg, rgba(197, 160, 89, 0.15) 0%, transparent 100%);
            border-left: 4px solid #c5a059;
            color: #c5a059;
        }

        .map-node:hover {
            filter: drop-shadow(0 0 8px #c5a059);
            transform: scale(1.1);
            cursor: pointer;
        }

        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Color Picker Reset */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 24px;
            height: 24px;
            padding: 0;
            overflow: hidden;
            border-radius: 50%;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
        }
    </style>
</head>
<body class="bg-wood min-h-screen text-gray-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- ICON POLYFILL ---
        const createLucideComponent = (iconName) => ({ size = 24, className = "", ...props }) => {
            const iconDef = lucide.icons[iconName] || lucide.icons[iconName.charAt(0).toLowerCase() + iconName.slice(1)];
            if (!iconDef) return null;
            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" 
                    fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" 
                    className={className} {...props}
                >
                    {iconDef.map(([tag, attrs], i) => React.createElement(tag, { ...attrs, key: i }))}
                </svg>
            );
        };

        const Icons = Object.fromEntries(
            ['Landmark', 'Users', 'BookOpen', 'Shield', 'TrendingUp', 'Menu', 'X', 
             'Gavel', 'AlertTriangle', 'Crosshair', 'Anchor', 'Wind', 'PieChart', 
             'Scroll', 'Map', 'Newspaper', 'ChevronRight', 'Clock', 'Trash2', 'Plus'].map(name => [name, createLucideComponent(name)])
        );

        const FLAG_URL = "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Flag_of_the_Republic_of_China_Army_Reserve.svg/2560px-Flag_of_the_Republic_of_China_Army_Reserve.svg.png";

        // --- COMPONENTS ---

        const Tooltip = ({ text, children }) => {
            const [show, setShow] = useState(false);
            return (
                <div className="relative flex items-center" onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)}>
                    {children}
                    {show && (
                        <div className="absolute left-full ml-2 z-50 w-48 bg-[#1a1816] border border-[#c5a059] p-2 shadow-xl text-xs text-[#e2d5c3] font-ui tracking-wide animate-fadeIn pointer-events-none">
                            {text}
                        </div>
                    )}
                </div>
            );
        };

        const StatItem = ({ icon: Icon, label, value, trend, desc }) => (
            <Tooltip text={desc}>
                <div className="flex flex-col items-center justify-center px-6 border-r border-[#ffffff10] last:border-0 min-w-[100px] cursor-help transition-colors hover:bg-[#ffffff05] py-2">
                    <div className="flex items-center gap-2 mb-1">
                        <Icon size={18} className="text-[#c5a059]" />
                        <span className={`font-header font-bold text-xl ${trend === 'positive' ? 'text-[#4caf50]' : trend === 'negative' ? 'text-[#e53935]' : 'text-[#ffb74d]'}`}>
                            {value}
                        </span>
                    </div>
                    <span className="text-[9px] uppercase tracking-[0.2em] text-[#8a7f70] font-bold">{label}</span>
                </div>
            </Tooltip>
        );

        const Portrait = ({ name, role, align = "center" }) => (
            <div className={`flex flex-col items-${align} mb-6 group cursor-pointer relative`}>
                <div className="w-40 h-48 bg-[#2c241b] border-[6px] border-[#3d342b] shadow-[0_5px_15px_rgba(0,0,0,0.5)] overflow-hidden relative transition-all duration-300 group-hover:border-[#c5a059] group-hover:-translate-y-1">
                    <div className="absolute inset-0 bg-cover bg-center grayscale contrast-125 sepia-[.4]" style={{backgroundImage: `url('https://i.pravatar.cc/400?u=${name.replace(' ','')}')`}}></div>
                    <div className="w-full h-full bg-gradient-to-t from-[#1a1816] via-transparent to-transparent absolute z-10 opacity-60"></div>
                </div>
                <div className={`mt-3 text-${align} relative z-20 bg-[#1a1816]/80 px-2 py-1 border-l-2 border-[#c5a059] backdrop-blur-sm`}>
                    <h3 className="font-header font-bold text-[#e2d5c3] text-xl leading-none mb-1">{name}</h3>
                    <p className="font-ui text-[10px] uppercase tracking-widest text-[#c5a059]">{role}</p>
                </div>
            </div>
        );

        const PaperReport = ({ title, subtitle, date, classification = "UNCLASSIFIED", children, emblem = true }) => (
            <div className="animate-report relative mx-auto max-w-4xl perspective-1000">
                <div className="paper-texture text-[#2c241b] p-8 md:p-16 min-h-[600px] relative z-10 transform transition-transform duration-500 hover:rotate-0">
                    
                    {/* Watermark/Bg Decoration */}
                    {emblem && <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 border-4 border-[#2c241b] rounded-full opacity-[0.03] pointer-events-none flex items-center justify-center">
                        <div className="w-48 h-48 border-2 border-[#2c241b] rounded-full"></div>
                    </div>}

                    {/* Stamp */}
                    <div className="animate-stamp opacity-0 absolute top-8 right-8 border-[3px] border-[#8b0000] p-2 px-4 rotate-[-12deg] z-20 mix-blend-multiply">
                        <span className="text-[#8b0000] font-black font-typewriter uppercase tracking-widest text-sm block stamp">{classification}</span>
                    </div>

                    {/* Header */}
                    <div className="border-b-4 double-border border-[#2c241b] pb-6 mb-8 text-center">
                        <div className="flex justify-center items-center gap-2 mb-4 text-[#5d5244] opacity-80">
                            <Icons.Anchor size={16} />
                            <span className="font-ui text-xs uppercase tracking-[0.3em]">Official State Document</span>
                            <Icons.Anchor size={16} />
                        </div>
                        <h1 className="font-header text-5xl font-black uppercase tracking-tight mb-2 text-[#1a1816]">{title}</h1>
                        {subtitle && <h2 className="font-header text-xl italic text-[#5d5244]">{subtitle}</h2>}
                        <div className="mt-4 inline-block bg-[#2c241b] text-[#f4f0e6] px-4 py-1 font-typewriter text-xs tracking-widest">
                            DATE: {date}
                        </div>
                    </div>

                    {/* Content */}
                    <div className="font-body text-lg leading-relaxed text-justify space-y-6">
                        {children}
                    </div>

                    {/* Footer */}
                    <div className="mt-16 pt-8 border-t border-[#d1c7b7] flex justify-between items-end opacity-60">
                        <div className="font-typewriter text-xs">
                            <p>REF: 49-A-121</p>
                            <p>AUTH: MINISTRY OF INFO</p>
                        </div>
                        <div className="text-right">
                             <img src={FLAG_URL} className="h-8 w-auto grayscale opacity-50 mb-1 ml-auto" />
                             <p className="font-header text-xs italic">For the Republic</p>
                        </div>
                    </div>
                </div>
                
                {/* Paper Stack Effect */}
                <div className="absolute top-2 left-2 w-full h-full bg-[#e6e0d4] -z-10 rotate-[0.5deg] shadow-lg"></div>
                <div className="absolute top-4 left-4 w-full h-full bg-[#dcd6c9] -z-20 rotate-[1deg] shadow-lg"></div>
            </div>
        );

        // --- PARLIAMENT BUILDER COMPONENT ---
        const ParliamentBuilder = ({ initialData }) => {
            const [parties, setParties] = useState(initialData);

            const handleUpdate = (index, field, value) => {
                const newParties = [...parties];
                newParties[index] = { ...newParties[index], [field]: value };
                setParties(newParties);
            };

            const addParty = () => {
                setParties([...parties, { id: Date.now(), name: "New Party", seats: 10, color: "#5d5244" }]);
            };

            const removeParty = (index) => {
                const newParties = parties.filter((_, i) => i !== index);
                setParties(newParties);
            };

            const totalSeats = parties.reduce((acc, p) => acc + parseInt(p.seats || 0), 0);

            // Generate Seats Logic
            const generateSeats = () => {
                const seatPoints = [];
                const rows = 8;
                const baseRadius = 120;
                
                // We calculate roughly how many seats fit in each row to create a nice arch
                // This is a visual approximation algorithm
                let seatsAllocated = 0;
                let currentRow = 0;
                
                // Distribute seats from outside in or inside out? usually inside out looks better for filling
                // But we need to assign them to parties.
                // First, create ALL seat positions
                const allPositions = [];
                
                for(let r = 0; r < rows; r++) {
                    const radius = baseRadius + (r * 22);
                    const arcLength = Math.PI * radius;
                    const seatSize = 14; // Approximate width including gap
                    const countInRow = Math.floor(arcLength / seatSize);
                    
                    const angleStep = Math.PI / (countInRow - 1);
                    
                    for(let s = 0; s < countInRow; s++) {
                         const angle = Math.PI - (s * angleStep); // Left to Right (180 to 0)
                         const x = 300 + (radius * Math.cos(angle));
                         const y = 350 - (radius * Math.sin(angle));
                         allPositions.push({ x, y, r });
                    }
                }

                // Now assign parties to these positions
                // We need to limit positions to totalSeats
                // Center the active seats in the available positions if we have more positions than seats?
                // Or just fill from the start. Let's simple fill.
                
                let currentPartyIndex = 0;
                let seatsInCurrentPartyProcessed = 0;
                
                // Take the 'middle' positions to center the parliament
                // Or just standard fill
                const usedPositions = allPositions.slice(0, totalSeats);

                return usedPositions.map((pos, i) => {
                    const party = parties[currentPartyIndex];
                    if (!party) return null;

                    seatsInCurrentPartyProcessed++;
                    if (seatsInCurrentPartyProcessed > party.seats) {
                        currentPartyIndex++;
                        seatsInCurrentPartyProcessed = 1;
                    }
                    
                    const actualParty = parties[currentPartyIndex] || parties[parties.length-1];

                    return (
                        <circle 
                            key={i} 
                            cx={pos.x} 
                            cy={pos.y} 
                            r="5" 
                            fill={actualParty.color} 
                            stroke="#2c241b" 
                            strokeWidth="1"
                            className="transition-all duration-300 hover:r-8"
                        >
                            <title>{actualParty.name}</title>
                        </circle>
                    );
                });
            };

            return (
                <div className="flex flex-col gap-8">
                    {/* VISUALIZATION */}
                    <div className="bg-[#e6e0d4] border border-[#d1c7b7] p-4 flex flex-col items-center shadow-inner rounded-sm">
                        <h4 className="font-header text-xl font-bold mb-2">Chamber Composition</h4>
                        <div className="relative w-full max-w-[600px] aspect-[5/3]">
                            <svg viewBox="0 0 600 400" className="w-full h-full">
                                {/* Podium */}
                                <rect x="270" y="360" width="60" height="30" fill="#4a4036" />
                                <path d="M260,390 L340,390 L330,360 L270,360 Z" fill="#2c241b" />
                                <g>{generateSeats()}</g>
                            </svg>
                            <div className="absolute bottom-4 left-0 w-full text-center">
                                <span className="bg-[#2c241b] text-[#c5a059] px-3 py-1 font-bold rounded text-sm shadow-md">
                                    Total Seats: {totalSeats}
                                </span>
                            </div>
                        </div>
                    </div>

                    {/* EDIT CONTROLS */}
                    <div className="border-t-2 border-[#2c241b] pt-6">
                        <div className="flex justify-between items-center mb-4">
                            <h4 className="font-ui font-bold uppercase text-sm tracking-widest text-[#5d5244]">Input Party Data</h4>
                            <button onClick={addParty} className="flex items-center gap-1 text-xs font-bold bg-[#c5a059] text-[#1a1816] px-3 py-1 rounded hover:bg-[#d4b06a] transition-colors">
                                <Icons.Plus size={14} /> Add Faction
                            </button>
                        </div>

                        <div className="space-y-2">
                            {parties.map((party, idx) => (
                                <div key={party.id} className="flex items-center gap-2 bg-[#ffffff10] p-2 rounded border border-[#d1c7b7] hover:border-[#c5a059] transition-colors">
                                    <input 
                                        type="color" 
                                        value={party.color} 
                                        onChange={(e) => handleUpdate(idx, 'color', e.target.value)}
                                        className="w-8 h-8 rounded cursor-pointer border-2 border-[#2c241b]"
                                        title="Party Color"
                                    />
                                    <input 
                                        type="text" 
                                        value={party.name} 
                                        onChange={(e) => handleUpdate(idx, 'name', e.target.value)}
                                        className="flex-1 bg-transparent border-b border-[#5d5244] text-[#2c241b] font-bold text-sm focus:outline-none focus:border-[#c5a059] px-1 font-ui"
                                        placeholder="Party Name"
                                    />
                                    <div className="flex items-center gap-1">
                                        <span className="text-[10px] uppercase font-bold text-[#5d5244]">Seats:</span>
                                        <input 
                                            type="number" 
                                            value={party.seats} 
                                            onChange={(e) => handleUpdate(idx, 'seats', parseInt(e.target.value) || 0)}
                                            className="w-16 bg-[#f4f0e6] border border-[#d1c7b7] text-[#2c241b] text-center font-bold text-sm rounded focus:outline-none focus:border-[#c5a059]"
                                        />
                                    </div>
                                    <button onClick={() => removeParty(idx)} className="text-[#e53935] hover:text-[#b71c1c] p-1" title="Remove Party">
                                        <Icons.Trash2 size={16} />
                                    </button>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // --- CUSTOM MAP COMPONENT ---
        const StrategicMap = () => (
            <div className="relative w-full aspect-[16/9] bg-[#b0a995] overflow-hidden border-4 border-[#4a4036] shadow-2xl group">
                {/* Map Texture */}
                <div className="absolute inset-0 opacity-30" style={{backgroundImage: "url('https://www.transparenttextures.com/patterns/aged-paper.png')"}}></div>
                <div className="absolute inset-0 bg-[#c2bba8] mix-blend-multiply"></div>
                
                {/* Grid Lines */}
                <div className="absolute inset-0" style={{backgroundImage: "linear-gradient(#8f8576 1px, transparent 1px), linear-gradient(90deg, #8f8576 1px, transparent 1px)", backgroundSize: "40px 40px", opacity: 0.1}}></div>

                {/* SVG Map Layer */}
                <svg className="absolute inset-0 w-full h-full pointer-events-auto" viewBox="0 0 800 450">
                    <defs>
                        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="2" dy="2" stdDeviation="2" floodColor="#000" floodOpacity="0.5"/>
                        </filter>
                    </defs>

                    {/* Borders */}
                    <path d="M-50,200 Q150,180 300,250 T600,200 T900,150" fill="none" stroke="#6d6150" strokeWidth="2" strokeDasharray="5,5" />
                    
                    {/* Connections (Roads/Rails) */}
                    <g stroke="#3d342b" strokeWidth="3" strokeLinecap="round" opacity="0.6">
                        <line x1="400" y1="225" x2="320" y2="150" />
                        <line x1="400" y1="225" x2="550" y2="280" />
                        <line x1="400" y1="225" x2="250" y2="300" />
                        <line x1="320" y1="150" x2="200" y2="140" />
                        <line x1="550" y1="280" x2="650" y2="200" />
                    </g>

                    {/* Cities */}
                    {[
                        {x: 400, y: 225, name: "OMRYBARAS", type: "capital"},
                        {x: 320, y: 150, name: "Solme", type: "city"},
                        {x: 550, y: 280, name: "Port Dravin", type: "port"},
                        {x: 250, y: 300, name: "Velas", type: "city"},
                        {x: 650, y: 200, name: "Lachaven", type: "city"},
                        {x: 200, y: 140, name: "Fort Krov", type: "fort"},
                    ].map((city, i) => (
                        <g key={i} className="map-node transition-all duration-300" style={{transformOrigin: `${city.x}px ${city.y}px`}}>
                            <circle cx={city.x} cy={city.y} r={city.type === 'capital' ? 14 : 8} fill="#1a1816" stroke="#c5a059" strokeWidth="2" filter="url(#shadow)" />
                            <circle cx={city.x} cy={city.y} r={city.type === 'capital' ? 6 : 3} fill="#c5a059" />
                            
                            {/* Label Tag */}
                            <g transform={`translate(${city.x + 15}, ${city.y - 15})`}>
                                <rect x="0" y="-14" width={city.name.length * 9} height="18" fill="#1a1816" opacity="0.8" rx="2" />
                                <text x="5" y="0" fill="#e2d5c3" fontFamily="Lato" fontSize="10" fontWeight="bold" letterSpacing="1">{city.name}</text>
                            </g>
                        </g>
                    ))}
                </svg>

                {/* Map Legend Overlay */}
                <div className="absolute bottom-4 left-4 bg-[#1a1816]/90 p-3 border border-[#c5a059] backdrop-blur-sm">
                    <h4 className="text-[#c5a059] font-header text-sm uppercase mb-2 border-b border-[#c5a059]/30 pb-1">Strategic Overview</h4>
                    <div className="space-y-1">
                        <div className="flex items-center gap-2 text-[10px] text-[#e2d5c3] font-ui uppercase"><div className="w-2 h-2 rounded-full bg-[#c5a059] border border-black"></div> Capital District</div>
                        <div className="flex items-center gap-2 text-[10px] text-[#e2d5c3] font-ui uppercase"><div className="w-2 h-2 rounded-full bg-[#2c241b] border border-[#c5a059]"></div> Regional Hub</div>
                        <div className="flex items-center gap-2 text-[10px] text-[#e2d5c3] font-ui uppercase"><div className="w-4 h-1 bg-[#3d342b]"></div> Main Railway</div>
                    </div>
                </div>
            </div>
        );

        // --- SUB-COMPONENTS ---

        const InfoCard = ({ title, children, type = "neutral" }) => {
            const colors = {
                neutral: "border-[#d1c7b7] bg-[#e6e0d4]",
                danger: "border-[#e53935] bg-[#ffebee]",
                success: "border-[#4caf50] bg-[#e8f5e9]",
                gold: "border-[#c5a059] bg-[#fff8e1]"
            };
            return (
                <div className={`p-4 border-l-4 shadow-sm ${colors[type]} mb-4`}>
                    <h4 className="font-bold uppercase text-xs tracking-widest mb-2 opacity-70 font-ui">{title}</h4>
                    <div className="text-sm font-body">{children}</div>
                </div>
            );
        };

        const NewsTicker = () => {
            const news = [
                "Strikes continue in Omrybaras manufacturing district...",
                "Arcasian investors pause capital flows due to instability...",
                "President Varela announces new Agricultural Subsidies Act...",
                "G'aleroi troops spotted near the southern mountain pass..."
            ];
            const [index, setIndex] = useState(0);

            useEffect(() => {
                const interval = setInterval(() => {
                    setIndex(prev => (prev + 1) % news.length);
                }, 5000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="bg-[#141210] border-t border-[#3d342b] py-2 px-4 flex items-center gap-4 overflow-hidden">
                    <span className="text-[#c5a059] font-bold text-xs uppercase tracking-widest shrink-0 flex items-center gap-2">
                        <div className="w-2 h-2 bg-[#e53935] rounded-full animate-pulse"></div>
                        Breaking News
                    </span>
                    <div className="font-typewriter text-[#a89f91] text-xs whitespace-nowrap animate-pulse">
                        {news[index]} <span className="text-[#5d5244] mx-2">///</span>
                    </div>
                </div>
            );
        }

        // --- MAIN APP ---

        function LasombyApp() {
            const [activeTab, setActiveTab] = useState('overview');
            const [showMobileMenu, setShowMobileMenu] = useState(false);
            // Turn counter removed as requested

            const PARLIAMENT_INITIAL = [
