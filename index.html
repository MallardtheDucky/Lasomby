<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Third Lasombian Republic | Government Terminal</title>
    
    <!-- SOCIAL / DISCORD EMBED TAGS -->
    <meta property="og:title" content="The Third Lasombian Republic Archives">
    <meta property="og:description" content="Official government terminal. View strategic maps, cabinet dossiers, economic reports, and budget allocations for the Third Republic.">
    <meta property="og:image" content="images/Lasomby Flag.png">
    <meta property="og:url" content="https://github.com/yourusername/lasomby-archives"> <!-- REPLACE WITH YOUR ACTUAL LINK -->
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#c5a059">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Lato:wght@300;400;700;900&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Special+Elite&display=swap');
        
        :root {
            --suzerain-gold: #c5a059;
            --suzerain-dark: #1a1816;
            --suzerain-brown: #2c241b;
            --suzerain-red: #8b0000;
            --suzerain-paper: #f4f0e6;
        }

        body {
            background-color: #0f0e0d;
            color: #2c241b;
            overflow-x: hidden;
        }
        
        /* Textures */
        .bg-wood {
            background-color: #1a1512;
            background-image: 
                linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.3)),
                url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            background-attachment: fixed;
        }

        .paper-texture {
            background-color: #f4f0e6;
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.5), 0 0 5px rgba(0,0,0,0.1);
        }

        .stamp {
            mask-image: url('https://www.transparenttextures.com/patterns/grunge-wall.png');
            -webkit-mask-image: url('https://www.transparenttextures.com/patterns/grunge-wall.png');
        }

        /* Typography */
        .font-header { font-family: 'Playfair Display', serif; }
        .font-ui { font-family: 'Lato', sans-serif; }
        .font-body { font-family: 'Merriweather', serif; }
        .font-typewriter { font-family: 'Special Elite', monospace; }

        /* Animations */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px) rotate(0.5deg); }
            to { opacity: 1; transform: translateY(0) rotate(0deg); }
        }
        
        @keyframes stamp-in {
            0% { opacity: 0; transform: scale(2) rotate(-20deg); }
            50% { opacity: 1; transform: scale(0.9) rotate(-10deg); }
            70% { transform: scale(1.05) rotate(-13deg); }
            100% { transform: scale(1) rotate(-12deg); }
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        
        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.95; }
            10% { opacity: 0.9; }
            15% { opacity: 0.95; }
            20% { opacity: 0.99; }
            50% { opacity: 0.95; }
            100% { opacity: 0.98; }
        }

        .animate-report { animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .animate-stamp { animation: stamp-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards opacity-0; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1816; }
        ::-webkit-scrollbar-thumb { background: #4a4036; border-radius: 4px; border: 1px solid #1a1816; }
        ::-webkit-scrollbar-thumb:hover { background: #c5a059; }

        /* Custom UI Elements */
        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 50;
            animation: flicker 4s infinite;
        }

        .scan-line {
            position: absolute;
            top: 0; left: 0; right: 0; height: 20px;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.05), rgba(255,255,255,0));
            animation: scanline 6s linear infinite;
            pointer-events: none;
            z-index: 51;
        }

        /* Chart Styles */
        .chart-bar { transition: height 0.5s ease-out; }
        .chart-bar:hover { fill: #c5a059; }
        
        /* Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #c5a059;
            border: 2px solid #2c241b;
            cursor: pointer;
            margin-top: -8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #d1c7b7;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-wood min-h-screen text-gray-200 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- ICON POLYFILL ---
        const createLucideComponent = (iconName) => ({ size = 24, className = "", ...props }) => {
            const iconDef = lucide.icons[iconName] || lucide.icons[iconName.charAt(0).toLowerCase() + iconName.slice(1)];
            if (!iconDef) return null;
            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" 
                    fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" 
                    className={className} {...props}
                >
                    {iconDef.map(([tag, attrs], i) => React.createElement(tag, { ...attrs, key: i }))}
                </svg>
            );
        };

        const Icons = Object.fromEntries(
            ['Landmark', 'Users', 'BookOpen', 'Shield', 'TrendingUp', 'Menu', 'X', 
             'Gavel', 'AlertTriangle', 'Crosshair', 'Anchor', 'Wind', 'PieChart', 
             'Scroll', 'Map', 'Newspaper', 'ChevronRight', 'Clock', 'Trash2', 'Plus', 'Upload', 'BarChart', 'Target', 'Briefcase', 'Scale'].map(name => [name, createLucideComponent(name)])
        );

        const FLAG_URL = "images/Lasomby Flag.png";

        // --- CHART COMPONENTS ---
        
        const SimpleBarChart = ({ data, height = 150 }) => {
            const maxVal = Math.max(...data.map(d => d.value));
            return (
                <div className="flex items-end justify-between gap-2 h-full w-full pt-4 px-2">
                    {data.map((d, i) => (
                        <div key={i} className="flex flex-col items-center flex-1 group">
                            <div className="relative w-full flex justify-center">
                                {/* Tooltip */}
                                <div className="absolute bottom-full mb-1 opacity-0 group-hover:opacity-100 transition-opacity bg-[#1a1816] text-[#e2d5c3] text-[10px] px-2 py-1 border border-[#c5a059] pointer-events-none z-10 whitespace-nowrap">
                                    {d.label}: {d.value}
                                </div>
                                <div 
                                    className="w-full max-w-[30px] min-w-[15px] bg-[#2c241b] border border-[#5d5244] group-hover:bg-[#c5a059] transition-colors shadow-sm" 
                                    style={{height: `${(d.value / maxVal) * height}px`}}
                                ></div>
                            </div>
                            <span className="text-[8px] md:text-[9px] font-bold uppercase mt-2 text-[#5d5244] text-center leading-tight">{d.shortLabel || d.label}</span>
                        </div>
                    ))}
                </div>
            );
        };

        const SimplePieChart = ({ data, size = 120 }) => {
            const total = data.reduce((acc, d) => acc + d.value, 0);
            let currentAngle = 0;

            return (
                <div className="relative flex flex-col md:flex-row items-center justify-center gap-4">
                    <svg width={size} height={size} viewBox="-1 -1 2 2" style={{transform: 'rotate(-90deg)'}}>
                        {data.map((d, i) => {
                            const sliceAngle = (d.value / total) * 2 * Math.PI;
                            const x1 = Math.cos(currentAngle);
                            const y1 = Math.sin(currentAngle);
                            const x2 = Math.cos(currentAngle + sliceAngle);
                            const y2 = Math.sin(currentAngle + sliceAngle);
                            const largeArc = sliceAngle > Math.PI ? 1 : 0;
                            
                            const pathData = `M 0 0 L ${x1} ${y1} A 1 1 0 ${largeArc} 1 ${x2} ${y2} Z`;
                            currentAngle += sliceAngle;
                            
                            return (
                                <path 
                                    key={i} 
                                    d={pathData} 
                                    fill={d.color} 
                                    stroke="#f4f0e6" 
                                    strokeWidth="0.02"
                                    className="hover:opacity-80 transition-opacity cursor-pointer"
                                >
                                    <title>{d.label}: {d.value}%</title>
                                </path>
                            );
                        })}
                    </svg>
                    {/* Legend */}
                    <div className="flex flex-col justify-center whitespace-nowrap gap-2">
                         {data.map((d, i) => (
                             <div key={i} className="flex items-center gap-2">
                                 <div className="w-3 h-3 rounded-full border border-black/20" style={{backgroundColor: d.color}}></div>
                                 <span className="text-xs font-bold font-ui text-[#5d5244]">{d.label} <span className="text-[#2c241b] opacity-60">({d.value}%)</span></span>
                             </div>
                         ))}
                    </div>
                </div>
            );
        };

        const BudgetSlider = ({ label, value, onChange, icon: Icon }) => (
            <div className="mb-4">
                <div className="flex justify-between items-center mb-1">
                    <div className="flex items-center gap-2">
                        <Icon size={14} className="text-[#5d5244]" />
                        <span className="font-bold text-xs uppercase text-[#2c241b] tracking-wider">{label}</span>
                    </div>
                    <span className={`text-xs font-bold ${value > 5 ? 'text-[#4caf50]' : value < 5 ? 'text-[#e53935]' : 'text-[#ffb74d]'}`}>
                        {value > 5 ? 'INCREASED' : value < 5 ? 'DECREASED' : 'MAINTAINED'}
                    </span>
                </div>
                <input 
                    type="range" 
                    min="1" 
                    max="10" 
                    value={value} 
                    onChange={(e) => onChange(parseInt(e.target.value))}
                    className="w-full h-2 bg-[#d1c7b7] rounded-lg appearance-none cursor-pointer"
                />
            </div>
        );

        // --- UI COMPONENTS ---

        const Tooltip = ({ text, children }) => {
            const [show, setShow] = useState(false);
            return (
                <div className="relative flex items-center" onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)}>
                    {children}
                    {show && (
                        <div className="absolute left-1/2 -translate-x-1/2 top-full mt-2 z-50 w-48 bg-[#1a1816] border border-[#c5a059] p-2 shadow-xl text-xs text-[#e2d5c3] font-ui tracking-wide animate-fadeIn pointer-events-none text-center">
                            {text}
                        </div>
                    )}
                </div>
            );
        };

        const StatItem = ({ icon: Icon, label, value, trend, desc }) => (
            <Tooltip text={desc}>
                <div className="flex flex-col items-center justify-center px-4 md:px-6 border-r border-[#ffffff10] last:border-0 min-w-[80px] md:min-w-[100px] cursor-help transition-colors hover:bg-[#ffffff05] py-2">
                    <div className="flex items-center gap-2 mb-1">
                        <Icon size={16} className="text-[#c5a059] hidden md:block" />
                        <span className={`font-header font-bold text-lg md:text-xl ${trend === 'positive' ? 'text-[#4caf50]' : trend === 'negative' ? 'text-[#e53935]' : 'text-[#ffb74d]'}`}>
                            {value}
                        </span>
                    </div>
                    <span className="text-[8px] md:text-[9px] uppercase tracking-[0.2em] text-[#8a7f70] font-bold">{label}</span>
                </div>
            </Tooltip>
        );

        const Portrait = ({ id, name, role, align = "center", currentImage, onUpload }) => {
            const fileInputRef = useRef(null);

            const handleClick = () => {
                fileInputRef.current.click();
            };

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        onUpload(id, reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            return (
                <div className={`flex flex-col items-center md:items-${align} mb-6 group relative w-full md:w-auto`}>
                    <input 
                        type="file" 
                        ref={fileInputRef} 
                        onChange={handleFileChange} 
                        className="hidden" 
                        accept="image/*"
                    />
                    
                    <div 
                        onClick={handleClick}
                        className="w-40 h-48 bg-[#2c241b] border-[6px] border-[#3d342b] shadow-[0_5px_15px_rgba(0,0,0,0.5)] overflow-hidden relative transition-all duration-300 group-hover:border-[#c5a059] group-hover:-translate-y-1 cursor-pointer"
                    >
                        <div className="absolute inset-0 bg-cover bg-center grayscale contrast-125 sepia-[.4]" style={{backgroundImage: `url('${currentImage}')`}}></div>
                        <div className="w-full h-full bg-gradient-to-t from-[#1a1816] via-transparent to-transparent absolute z-10 opacity-60"></div>
                        
                        {/* Hover Overlay */}
                        <div className="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <Icons.Upload className="text-[#c5a059]" />
                        </div>
                    </div>
                    
                    <div className={`mt-3 text-center md:text-${align} relative z-20 bg-[#1a1816]/80 px-4 py-2 border-l-2 border-[#c5a059] backdrop-blur-sm pointer-events-none w-full md:w-auto`}>
                        <h3 className="font-header font-bold text-[#e2d5c3] text-xl leading-none mb-1">{name}</h3>
                        <p className="font-ui text-[10px] uppercase tracking-widest text-[#c5a059]">{role}</p>
                    </div>
                </div>
            );
        };

        const PaperReport = ({ title, subtitle, date, classification = "UNCLASSIFIED", children, emblem = true }) => (
            <div className="animate-report relative mx-auto max-w-4xl perspective-1000 mb-20">
                <div className="paper-texture text-[#2c241b] p-6 md:p-16 min-h-[600px] relative z-10 transform transition-transform duration-500 hover:rotate-0 border border-[#d1c7b7]">
                    
                    {/* Watermark/Bg Decoration */}
                    {emblem && <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 md:w-64 md:h-64 border-4 border-[#2c241b] rounded-full opacity-[0.03] pointer-events-none flex items-center justify-center">
                        <div className="w-32 h-32 md:w-48 md:h-48 border-2 border-[#2c241b] rounded-full"></div>
                    </div>}

                    {/* Stamp */}
                    <div className="animate-stamp opacity-0 absolute top-4 right-4 md:top-8 md:right-8 border-[3px] border-[#8b0000] p-1 px-3 md:p-2 md:px-4 rotate-[-12deg] z-20 mix-blend-multiply">
                        <span className="text-[#8b0000] font-black font-typewriter uppercase tracking-widest text-[10px] md:text-sm block stamp">{classification}</span>
                    </div>

                    {/* Header */}
                    <div className="border-b-4 double-border border-[#2c241b] pb-6 mb-8 text-center mt-6 md:mt-0">
                        <div className="flex justify-center items-center gap-2 mb-4 text-[#5d5244] opacity-80">
                            <Icons.Anchor size={16} />
                            <span className="font-ui text-[10px] md:text-xs uppercase tracking-[0.3em]">Official State Document</span>
                            <Icons.Anchor size={16} />
                        </div>
                        <h1 className="font-header text-3xl md:text-5xl font-black uppercase tracking-tight mb-2 text-[#1a1816]">{title}</h1>
                        {subtitle && <h2 className="font-header text-lg md:text-xl italic text-[#5d5244]">{subtitle}</h2>}
                        <div className="mt-4 inline-block bg-[#2c241b] text-[#f4f0e6] px-4 py-1 font-typewriter text-xs tracking-widest">
                            DATE: {date}
                        </div>
                    </div>

                    {/* Content */}
                    <div className="font-body text-base md:text-lg leading-relaxed text-justify space-y-6">
                        {children}
                    </div>

                    {/* Footer */}
                    <div className="mt-16 pt-8 border-t border-[#d1c7b7] flex flex-col md:flex-row justify-between items-center md:items-end opacity-60 gap-4">
                        <div className="font-typewriter text-xs text-center md:text-left">
                            <p>REF: 49-A-121</p>
                            <p>AUTH: MINISTRY OF INFO</p>
                        </div>
                        <div className="text-center md:text-right">
                             <img src={FLAG_URL} className="h-8 w-auto grayscale opacity-50 mb-1 mx-auto md:ml-auto" />
                             <p className="font-header text-xs italic">For the Republic</p>
                        </div>
                    </div>
                </div>
                
                {/* Paper Stack Effect */}
                <div className="absolute top-2 left-2 w-full h-full bg-[#e6e0d4] -z-10 rotate-[0.5deg] shadow-lg"></div>
                <div className="absolute top-4 left-4 w-full h-full bg-[#dcd6c9] -z-20 rotate-[1deg] shadow-lg"></div>
            </div>
        );

        // --- PARLIAMENT BUILDER COMPONENT ---
        const ParliamentBuilder = ({ initialData }) => {
            const [parties, setParties] = useState(initialData);

            const handleUpdate = (index, field, value) => {
                const newParties = [...parties];
                newParties[index] = { ...newParties[index], [field]: value };
                setParties(newParties);
            };

            const addParty = () => {
                setParties([...parties, { id: Date.now(), name: "New Party", seats: 10, color: "#5d5244" }]);
            };

            const removeParty = (index) => {
                const newParties = parties.filter((_, i) => i !== index);
                setParties(newParties);
            };

            const totalSeats = parties.reduce((acc, p) => acc + parseInt(p.seats || 0), 0);

            const generateSeats = () => {
                const rows = 8;
                const baseRadius = 120;
                const allPositions = [];
                for(let r = 0; r < rows; r++) {
                    const radius = baseRadius + (r * 22);
                    const seatSize = 14; 
                    const arcLength = Math.PI * radius;
                    const countInRow = Math.floor(arcLength / seatSize);
                    const angleStep = Math.PI / (countInRow - 1);
                    for(let s = 0; s < countInRow; s++) {
                         const angle = Math.PI - (s * angleStep);
                         const x = 300 + (radius * Math.cos(angle));
                         const y = 350 - (radius * Math.sin(angle));
                         allPositions.push({ x, y, r });
                    }
                }
                
                let currentPartyIndex = 0;
                let seatsInCurrentPartyProcessed = 0;
                const usedPositions = allPositions.slice(0, totalSeats);

                return usedPositions.map((pos, i) => {
                    const party = parties[currentPartyIndex];
                    if (!party) return null;
                    seatsInCurrentPartyProcessed++;
                    if (seatsInCurrentPartyProcessed > party.seats) {
                        currentPartyIndex++;
                        seatsInCurrentPartyProcessed = 1;
                    }
                    const actualParty = parties[currentPartyIndex] || parties[parties.length-1];
                    return (
                        <circle key={i} cx={pos.x} cy={pos.y} r="5" fill={actualParty.color} stroke="#2c241b" strokeWidth="1" className="transition-all duration-300 hover:r-8">
                            <title>{actualParty.name}</title>
                        </circle>
                    );
                });
            };

            return (
                <div className="flex flex-col gap-8">
                    {/* VISUALIZATION */}
                    <div className="bg-[#e6e0d4] border border-[#d1c7b7] p-4 flex flex-col items-center shadow-inner rounded-sm overflow-hidden">
                        <h4 className="font-header text-xl font-bold mb-2">Chamber Composition</h4>
                        <div className="relative w-full max-w-[600px] aspect-[5/3]">
                            <svg viewBox="0 0 600 400" className="w-full h-full">
                                <rect x="270" y="360" width="60" height="30" fill="#4a4036" />
                                <path d="M260,390 L340,390 L330,360 L270,360 Z" fill="#2c241b" />
                                <g>{generateSeats()}</g>
                            </svg>
                            <div className="absolute bottom-4 left-0 w-full text-center">
                                <span className="bg-[#2c241b] text-[#c5a059] px-3 py-1 font-bold rounded text-sm shadow-md">Total Seats: {totalSeats}</span>
                            </div>
                        </div>
                    </div>

                    {/* EDIT CONTROLS */}
                    <div className="border-t-2 border-[#2c241b] pt-6">
                        <div className="flex justify-between items-center mb-4">
                            <h4 className="font-ui font-bold uppercase text-sm tracking-widest text-[#5d5244]">Input Party Data</h4>
                            <button onClick={addParty} className="flex items-center gap-1 text-xs font-bold bg-[#c5a059] text-[#1a1816] px-3 py-1 rounded hover:bg-[#d4b06a] transition-colors">
                                <Icons.Plus size={14} /> Add Faction
                            </button>
                        </div>
                        <div className="space-y-2">
                            {parties.map((party, idx) => (
                                <div key={party.id} className="flex flex-col md:flex-row items-start md:items-center gap-2 bg-[#ffffff10] p-2 rounded border border-[#d1c7b7] hover:border-[#c5a059] transition-colors">
                                    <div className="flex items-center gap-2 w-full md:w-auto">
                                        <input type="color" value={party.color} onChange={(e) => handleUpdate(idx, 'color', e.target.value)} className="w-8 h-8 rounded cursor-pointer border-2 border-[#2c241b] shrink-0" />
                                        <input type="text" value={party.name} onChange={(e) => handleUpdate(idx, 'name', e.target.value)} className="flex-1 bg-transparent border-b border-[#5d5244] text-[#2c241b] font-bold text-sm focus:outline-none focus:border-[#c5a059] px-1 font-ui" placeholder="Party Name" />
                                    </div>
                                    <div className="flex items-center gap-2 w-full md:w-auto justify-between">
                                        <div className="flex items-center gap-1">
                                            <span className="text-[10px] uppercase font-bold text-[#5d5244]">Seats:</span>
                                            <input type="number" value={party.seats} onChange={(e) => handleUpdate(idx, 'seats', parseInt(e.target.value) || 0)} className="w-16 bg-[#f4f0e6] border border-[#d1c7b7] text-[#2c241b] text-center font-bold text-sm rounded focus:outline-none focus:border-[#c5a059]" />
                                        </div>
                                        <button onClick={() => removeParty(idx)} className="text-[#e53935] hover:text-[#b71c1c] p-1"><Icons.Trash2 size={16} /></button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const InfoCard = ({ title, children, type = "neutral" }) => {
            const colors = {
                neutral: "border-[#d1c7b7] bg-[#e6e0d4]",
                danger: "border-[#e53935] bg-[#ffebee]",
                success: "border-[#4caf50] bg-[#e8f5e9]",

                                    <div className="space-y-8">
                                        <div className="flex gap-4">
                                            <div className="shrink-0 mt-1"><Icons.Target className="text-[#c5a059]" /></div>
                                            <div>
                                                <h3 className="font-header font-bold text-lg uppercase tracking-wide">Strategic Posture</h3>
                                                <p className="font-typewriter text-xs mb-2 text-[#5d5244]">DEFENSIVE / DETERRENCE</p>
                                                <p className="text-sm">
                                                    Current doctrine relies on the elite Mountain Division to hold the G'aleroi passes while Mechanized Divisions act as a rapid reaction force. Naval assets prioritize trade route protection against piracy and foreign interdiction.
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </PaperReport>
                            )}

                            {activeTab === 'economy' && (
                                <PaperReport title="Economic Outlook" subtitle="Fiscal Year 1949" date="JANUARY REPORT">
                                    <div className="flex flex-col gap-8 mb-8">
                                        {/* Mobile Optimized: Stack Charts vertically on small screens */}
                                        <div className="flex flex-col md:flex-row gap-8">
                                            <div className="flex-1">
                                                <h3 className="font-header font-bold text-xl mb-4 text-[#4caf50]">Production Profile</h3>
                                                <div className="bg-[#fcfbf9] p-4 border border-[#d1c7b7] rounded-sm shadow-inner">
                                                    <SimpleBarChart 
                                                        data={[
                                                            { label: "Textiles", shortLabel: "TEXTILES", value: 85 },
                                                            { label: "Mining", shortLabel: "MINING", value: 65 },
                                                            { label: "Naval", shortLabel: "NAVAL", value: 45 },
                                                            { label: "Farming", shortLabel: "FARMING", value: 30 }
                                                        ]} 
                                                        height={180}
                                                    />
                                                </div>
                                                <div className="mt-6 space-y-3 font-typewriter text-sm">
                                                     <div className="flex justify-between border-b border-[#d1c7b7] border-dashed pb-1">
                                                         <span>TEXTILES & GARMENTS</span>
                                                         <span className="font-bold text-[#4caf50]">HIGH OUTPUT</span>
                                                     </div>
                                                     <div className="flex justify-between border-b border-[#d1c7b7] border-dashed pb-1">
                                                         <span>CHROMIUM MINING</span>
                                                         <span className="font-bold text-[#ffb74d]">STABLE</span>
                                                     </div>
                                                      <div className="flex justify-between border-b border-[#d1c7b7] border-dashed pb-1">
                                                         <span>AGRICULTURE</span>
                                                         <span className="font-bold text-[#e53935]">CRITICAL</span>
                                                     </div>
                                                </div>
                                            </div>
                                            <div className="w-full md:w-1/3 bg-[#e6e0d4] p-6 border border-[#d1c7b7] shadow-lg md:rotate-1 flex flex-col justify-between">
                                                <h4 className="font-bold uppercase text-xs tracking-widest mb-4 text-center text-[#5d5244] border-b border-[#c5a059] pb-2">Trade Balance</h4>
                                                
                                                <div className="text-xs space-y-4 mb-4">
                                                    <div>
                                                        <span className="font-bold block mb-1 uppercase text-[#2c241b]">Exports:</span>
                                                        <p className="font-serif italic leading-tight">Machinery, Chemicals, Wine, Chromium.</p>
                                                    </div>
                                                    <div>
                                                        <span className="font-bold block mb-1 uppercase text-[#2c241b]">Imports:</span>
                                                        <p className="font-serif italic leading-tight">Petroleum, Iron Ore, Aviation Tech.</p>
                                                    </div>
                                                </div>

                                                <div className="pt-4 border-t border-[#d1c7b7] flex justify-center">
                                                    <SimplePieChart 
                                                        size={100}
                                                        data={[
                                                            { label: 'Export', value: 45, color: '#4caf50' },
                                                            { label: 'Import', value: 55, color: '#e53935' }
                                                        ]} 
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    {/* NEW FEATURE: BUDGET ALLOCATION SLIDERS */}
                                    <div className="bg-[#e6e0d4] p-6 border-l-4 border-[#c5a059] shadow-md mb-8">
                                        <h3 className="font-header font-bold text-xl mb-4 text-[#2c241b] border-b border-[#c5a059] pb-2">Ministry Allocation</h3>
                                        <p className="text-xs font-ui mb-4 text-[#5d5244]">Adjust funding levels. Changes impact the national budget immediately.</p>
                                        
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-2">
                                            <BudgetSlider 
                                                label="Health" 
                                                value={budget.health} 
                                                onChange={(v) => setBudget({...budget, health: v})}
                                                icon={Icons.Plus}
                                            />
                                            <BudgetSlider 
                                                label="Education" 
                                                value={budget.education} 
                                                onChange={(v) => setBudget({...budget, education: v})}
                                                icon={Icons.BookOpen}
                                            />
                                            <BudgetSlider 
                                                label="Military" 
                                                value={budget.military} 
                                                onChange={(v) => setBudget({...budget, military: v})}
                                                icon={Icons.Shield}
                                            />
                                            <BudgetSlider 
                                                label="Law & Justice" 
                                                value={budget.law} 
                                                onChange={(v) => setBudget({...budget, law: v})}
                                                icon={Icons.Scale}
                                            />
                                        </div>
                                    </div>

                                    <div className="mb-8">
                                        <h4 className="font-header font-bold text-lg mb-2">Budget Trend (5 Year)</h4>
                                        <div className="h-32 flex items-end justify-between gap-1 border-b border-[#2c241b] pb-1 px-2 relative">
                                            {/* Grid lines */}
                                            <div className="absolute inset-0 w-full h-full pointer-events-none flex flex-col justify-between opacity-10">
                                                <div className="border-b border-black"></div>
                                                <div className="border-b border-black"></div>
                                                <div className="border-b border-black"></div>
                                            </div>
                                            {[-1, -2, -1, -3, -2].map((val, i) => (
                                                <div key={i} className="flex-1 flex flex-col items-center justify-end h-full z-10 group">
                                                    <div 
                                                        className="w-4 md:w-8 bg-[#e53935] opacity-80 hover:opacity-100 transition-opacity" 
                                                        style={{height: `${Math.abs(val) * 20}px`}}
                                                    ></div>
                                                    <span className="text-[9px] mt-1 font-bold text-[#5d5244]">{1945+i}</span>
                                                </div>
                                            ))}
                                        </div>
                                        <p className="text-xs text-center mt-2 text-[#e53935] font-bold font-typewriter">Status: DEFICIT SPENDING</p>
                                    </div>

                                    <InfoCard title="Critical Situation Update" type="danger">
                                        Foreign investment is high but volatile. <span className="font-bold">Arcasian investors</span> have paused capital flows due to recent instability. Strike action in Omrybaras threatens banking liquidity.
                                    </InfoCard>
                                </PaperReport>
                            )}

                            {activeTab === 'codex' && (
                                <PaperReport title="Historical Codex" subtitle="Archives of the Republic" date="REFERENCE" classification="UNCLASSIFIED">
                                    <div className="space-y-8">
                                        <section>
                                            <h3 className="font-header font-bold text-2xl mb-2 text-[#c5a059]">Ancient Period (800-1100 AH)</h3>
                                            <p className="text-sm mb-2">
                                                Emerging from tribal confederations, the Empire of Lasombia flourished as a maritime power. Unlike its neighbors, it resisted full Markian cultural assimilation, developing a unique synthesis of Nemic traditions and Markian administration.
                                            </p>
                                            <p className="text-sm italic border-l-2 border-[#c5a059] pl-4">
                                                The "Zaranurity" faith emerged here—a blend of Zaranist monotheism and indigenous solar worship.
                                            </p>
                                        </section>

                                        <section>
                                            <h3 className="font-header font-bold text-2xl mb-2 text-[#8b0000]">The Markian Wars</h3>
                                            <p className="text-sm">
                                                Resisting the southern expansion of the Markian Empire, Lasombia utilized its mountain fortresses to devastating effect. The <span className="font-bold">Battle of the Copper Passes (1247 AH)</span> saw the annihilation of a 40,000-strong invasion force, though the victory left the nation exhausted and its coastal cities sacked.
                                            </p>
                                        </section>

                                        <section>
                                            <h3 className="font-header font-bold text-2xl mb-2 text-[#2c241b]">The Mousser Conquest</h3>
                                            <p className="text-sm">
                                                Unlike the military Markians, the Mousser Empire conquered via debt and cultural penetration. From 1658 to 1847, Lasomby was a "Crown Dominion." This period created the deep class divide between the Mousser-speaking aristocracy and the Nemic peasantry that plagues the republic today.
                                            </p>
                                        </section>

                                        <section>
                                            <h3 className="font-header font-bold text-2xl mb-2 text-[#3d342b]">The Directorate (1923-1944)</h3>
                                            <p className="text-sm">
                                                Following the failure of the early republics, General Navarro established a military junta known as "The Directorate." Characterized by the "Years of Silence" (1925-1930), tens of thousands of dissidents disappeared. The regime collapsed in 1944, leading to the current Omrybaras Accords and the establishment of the Third Republic.
                                            </p>
                                        </section>
                                    </div>
                                </PaperReport>
                            )}
                            
                        </main>
                        
                        {/* BOTTOM NEWS TICKER */}
                        <NewsTicker />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LasombyApp />);
    </script>
</body>
</html>
